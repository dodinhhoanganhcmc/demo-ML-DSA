# CI for the ML-DSA Signature Demo.
#
# Every job runs a command set that is executed locally first (REPORT.md
# records the local runs): pytest, vitest, next build, docker compose build,
# and the Playwright end-to-end suite against the real stack.
#
# There is no deployment target for this course demo (it runs on the
# presenter's machine), so "CD" here means: every push is packaged into a
# runnable `docker compose up` stack and verified end-to-end.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend — pytest (42 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest tests -q

  frontend:
    name: Frontend — vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Run unit + component tests
        run: npx vitest run
      - name: Production build (typecheck included)
        run: npm run build

  docker:
    name: Docker — compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build both images
        run: docker compose build

  e2e:
    name: E2E — Playwright against the real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend (127.0.0.1:8000)
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health
      - name: Build + start frontend (localhost:3000)
        working-directory: frontend
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 1
          done
      - name: Run e2e suite
        run: npx playwright test
        working-directory: frontend
